name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: ${{ matrix.project }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Auth
            directory: gootip-auth
            package_json: gootip-auth/package.json
            lockfile: gootip-auth/pnpm-lock.yaml
            checks: auth
          - project: Core
            directory: gootip-core
            package_json: gootip-core/package.json
            lockfile: gootip-core/pnpm-lock.yaml
            checks: core
          - project: Frontend
            directory: gootip-front
            package_json: gootip-front/package.json
            lockfile: gootip-front/pnpm-lock.yaml
            checks: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: ${{ matrix.package_json }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: ${{ matrix.lockfile }}
      - run: pnpm install --frozen-lockfile
        working-directory: ${{ matrix.directory }}
      - run: pnpm lint && pnpm format:check
        working-directory: ${{ matrix.directory }}
      - name: Auth checks
        if: matrix.checks == 'auth'
        working-directory: gootip-auth
        run: pnpm typecheck && pnpm test && pnpm build
      - name: Core checks
        if: matrix.checks == 'core'
        working-directory: gootip-core
        run: pnpm typecheck && pnpm test:unit && pnpm build
      - name: Frontend checks
        if: matrix.checks == 'frontend'
        working-directory: gootip-front
        run: pnpm exec tsc --noEmit && pnpm build

  db-config:
    name: DB-config
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.8.22/install.sh | sh
      - run: uv sync --locked
        working-directory: gootip-db-config
      - run: uv run ruff check . && uv run ruff format --check . && uv run pytest -m 'not integration' -q
        working-directory: gootip-db-config

  release-artifacts:
    name: Release artifacts and infrastructure
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: gootip-auth/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            gootip-auth/pnpm-lock.yaml
            gootip-core/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: gootip-auth
      - run: pnpm install --frozen-lockfile
        working-directory: gootip-core
      - name: Build four Lambda archives
        env:
          MIGRATION_COMMIT_SHA: ${{ github.sha }}
        run: |
          (cd gootip-auth && pnpm build:lambda && pnpm lambda:zip && pnpm build:migration-lambda && pnpm migration-lambda:zip)
          (cd gootip-core && pnpm build:lambda && pnpm lambda:zip && pnpm build:migration-lambda && pnpm migration-lambda:zip)
      - name: Save first-build archives
        run: |
          mkdir -p "$RUNNER_TEMP/first-build/auth" "$RUNNER_TEMP/first-build/core"
          cp gootip-auth/lambda.zip gootip-auth/migration-lambda.zip "$RUNNER_TEMP/first-build/auth/"
          cp gootip-core/lambda.zip gootip-core/migration-lambda.zip "$RUNNER_TEMP/first-build/core/"
      - name: Rebuild and verify reproducibility
        env:
          MIGRATION_COMMIT_SHA: ${{ github.sha }}
        run: |
          (cd gootip-auth && pnpm build:lambda && pnpm lambda:zip && pnpm build:migration-lambda && pnpm migration-lambda:zip)
          (cd gootip-core && pnpm build:lambda && pnpm lambda:zip && pnpm build:migration-lambda && pnpm migration-lambda:zip)
          for project in auth core; do
            for archive in lambda.zip migration-lambda.zip; do
              cmp "$RUNNER_TEMP/first-build/$project/$archive" "gootip-$project/$archive"
            done
          done
      - name: Package the public RDS CA bundle
        run: ./scripts/package_rds_ca_layer.sh
        working-directory: gootip-infra
      - name: Validate archive layout, digests, manifests, and deployment sizes
        run: python3 gootip-infra/scripts/verify_release_artifacts.py --output "$RUNNER_TEMP/release-manifest.json"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Install pinned verification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zsh
          curl -fsSL https://github.com/terraform-linters/tflint/releases/download/v0.64.0/tflint_linux_amd64.zip -o "$RUNNER_TEMP/tflint.zip"
          unzip -q "$RUNNER_TEMP/tflint.zip" -d "$RUNNER_TEMP/tflint"
          sudo install "$RUNNER_TEMP/tflint/tflint" /usr/local/bin/tflint
          curl -fsSL https://github.com/aquasecurity/trivy/releases/download/v0.76.0/trivy_0.76.0_Linux-64bit.tar.gz | tar -xz -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/trivy" /usr/local/bin/trivy
          curl -LsSf https://astral.sh/uv/0.8.22/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Initialize Terraform roots offline
        working-directory: gootip-infra
        run: |
          terraform init -backend=false -input=false -lockfile=readonly
          terraform -chdir=bootstrap init -backend=false -input=false -lockfile=readonly
      - run: ./scripts/package_lambda.sh
        working-directory: gootip-db-config
      - run: ./scripts/verify_fast.sh
        working-directory: gootip-infra
      - run: tflint --recursive
        working-directory: gootip-infra
      - run: trivy config --exit-code 1 .
        working-directory: gootip-infra

  postgres-integration:
    name: PostgreSQL integration
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: gootip-auth/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            gootip-auth/pnpm-lock.yaml
            gootip-core/pnpm-lock.yaml
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned uv
        run: |
          curl -LsSf https://astral.sh/uv/0.8.22/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
        working-directory: gootip-auth
      - run: pnpm install --frozen-lockfile
        working-directory: gootip-core
      - run: uv sync --locked
        working-directory: gootip-db-config
      - name: Configure disposable PostgreSQL credentials
        run: |
          {
            printf 'POSTGRES_ADMIN_USER=gootip_local_admin\n'
            printf 'POSTGRES_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'AUTH_MIGRATOR_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'AUTH_RUNTIME_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'CORE_MIGRATOR_PASSWORD=%s\n' "$(openssl rand -hex 24)"
            printf 'CORE_RUNTIME_PASSWORD=%s\n' "$(openssl rand -hex 24)"
          } > gootip-infra/local/postgres.env
          chmod 600 gootip-infra/local/postgres.env
      - run: ./scripts/local_postgres.sh bootstrap
        working-directory: gootip-infra
      - run: ./scripts/local_postgres.sh integration
        working-directory: gootip-infra
