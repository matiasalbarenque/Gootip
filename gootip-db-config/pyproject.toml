[project]
name = "gootip-db-config"
version = "0.1.0"
description = "Administrative AWS Lambda that bootstraps PostgreSQL roles, schemas, and grants for Gootip."
requires-python = ">=3.13,<3.14"
dependencies = [
  "boto3==1.43.114",
  "psycopg[binary]==3.3.6",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.1",
]

# This project ships as a Lambda ZIP, not a wheel, so it is not installed into
# the environment. Tests import the package from src via pytest's pythonpath.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires the guarded shared local PostgreSQL test databases",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["gootip_db_config", "conftest", "helpers"]
